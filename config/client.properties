# ---------------------------------------------------------------------------
# Client settings. Override on the command line, e.g.
#   java -cp target\distrilab.jar client.Client --bootstrap=192.168.1.50:50050
# ---------------------------------------------------------------------------
bootstrap=localhost:50050
# Optional backup contacts used if the Bootstrap Node is down, e.g. 192.168.1.51:50051,192.168.1.52:50052
contacts=
rpcTimeoutMs=3000
# How often the cluster table is refreshed
statusRefreshMs=2000
# Folder opened by "Load CSV..."
dataDirectory=data
darkTheme=false
