# ---------------------------------------------------------------------------
# Bootstrap Node settings. Any value can be overridden on the command line,
# e.g.  java -cp target\distrilab.jar bootstrap.BootstrapNode --port=50060
# ---------------------------------------------------------------------------

# gRPC port the Bootstrap Node listens on (workers and clients connect here)
port=50050

# A worker that does not renew its lease within this time is removed
leaseTimeoutMs=6000

# How many random active workers a joining worker is linked to
peersOnJoin=2
