# ---------------------------------------------------------------------------
# Worker settings. Override on the command line, e.g.
#   java -cp target\distrilab.jar worker.Worker --bootstrap=192.168.1.50:50050 --id=3 --port=50053
# ---------------------------------------------------------------------------

# Address of the Bootstrap Node (host:port). Use the Bootstrap computer's IP on a LAN.
bootstrap=localhost:50050

# Worker id (0 = let the Bootstrap Node assign the next unused id) and gRPC port (0 = any free port)
id=0
port=0

# Address other machines use to reach this worker (empty = detect automatically)
host=

# Threads used for computation (0 = number of CPU cores)
computeThreads=0

# Default deadline for small RPCs
rpcTimeoutMs=2000

# --- Membership and failure detection ------------------------------------
leaseRenewMs=2000
# Coordinator -> worker heartbeat period
heartbeatIntervalMs=1000
# Missed heartbeats before a worker is SUSPECT (slow) and DEAD (failed)
suspectAfterMisses=2
deadAfterMisses=4
# A worker starts an election if the coordinator is silent this long (and a direct check fails)
coordinatorTimeoutMs=4000

# --- Overlay network -------------------------------------------------------
initialNeighbours=2
minNeighbours=2
neighbourPingMs=2000

# --- Leader election -------------------------------------------------------
# The first election waits this long after start-up (so workers starting together all take part)
startupGraceMs=4000
# ... and, optionally, until this many workers are registered (gives up after 5 x startupGraceMs)
minWorkersForFirstElection=1
electionTimeoutMs=8000
# Random back-off so that usually only one worker starts an election after a failure
electionJitterMs=800
# Jobs a coordinator may assign per term before a new election
maxJobsPerTerm=5
# JAC counting: 'job' (+1 per job given to other workers) or 'subtask' (+1 per subtask)
jacCounting=job

# --- Scheduling and recovery ------------------------------------------------
# Each job is split into (workers x subtasksPerWorker) subtasks
subtasksPerWorker=4
# Subtasks of one job a worker runs at the same time; it gets the next one when it finishes one
maxInFlightPerWorker=2
# A subtask with no progress for this long (worker still alive) gets a backup copy elsewhere
stallTimeoutMs=30000
maxAttemptsPerSubtask=8
# Replicas that must confirm a new job before the client is told it was accepted
replicationSyncAcks=1

debug=false
