// ============================================================================
// job.proto - client <-> cluster API (served by every worker; only the
// coordinator accepts new jobs).
// ============================================================================
syntax = "proto3";

package distrilab;

import "common.proto";
import "replication.proto";

option java_package = "proto";
option java_multiple_files = true;

service JobService {
  // Submit a job. Idempotent: re-submitting the same job_id returns the
  // existing job instead of running it twice.
  rpc SubmitJob(JobRequest) returns (JobAccepted);

  // Live progress of a job (server streaming) until it completes or fails.
  rpc WatchJob(WatchRequest) returns (stream JobProgress);

  // Which worker currently owns (drives) a job? Answered from replicas.
  rpc LocateJob(WatchRequest) returns (JobLocation);

  // Which worker is the coordinator?
  rpc WhoIsCoordinator(Empty) returns (CoordinatorInfo);

  // Cluster overview for the client dashboard.
  rpc GetClusterStatus(Empty) returns (ClusterStatus);

  // Stop a running job (only the job's owner can do this).
  rpc CancelJob(WatchRequest) returns (Ack);
}

message JobRequest {
  string job_id = 1;     // generated by the client (UUID)
  string client_id = 2;
  JobType type = 3;
  repeated sint64 numbers = 4;
  int64 range_start = 5;
  int64 range_end = 6;
}

message JobAccepted {
  string job_id = 1;
  NodeInfo owner = 2;
  int32 term = 3;
  int32 subtask_count = 4;
  int32 job_number_in_term = 5;
}

message WatchRequest {
  string job_id = 1;
}

message JobLocation {
  bool found = 1;
  NodeInfo owner = 2;
  JobStatus status = 3;
  string result = 4;
}

enum WorkerHealth {
  HEALTH_UNSPECIFIED = 0;
  ALIVE = 1;
  SUSPECT = 2;   // missed heartbeats - may just be slow
  DEAD = 3;      // declared failed - its work is reassigned
}

// Per-worker contribution to one job (the "worker-level breakdown").
message WorkerProgress {
  int32 worker_id = 1;
  WorkerHealth health = 2;
  int32 subtasks_assigned = 3;
  int32 subtasks_done = 4;
  int32 subtasks_running = 5;
  int64 units_done = 6;      // units completed by this worker (incl. in-progress)
  int64 units_assigned = 7;
}

message JobProgress {
  string job_id = 1;
  JobType type = 2;
  JobStatus status = 3;
  double percent = 4;              // 0..100, from completed work units
  int64 units_done = 5;
  int64 units_total = 6;
  int32 subtasks_done = 7;
  int32 subtasks_total = 8;
  repeated WorkerProgress workers = 9;
  string result = 10;
  string error = 11;
  NodeInfo owner = 12;
  int32 term = 13;
  int64 elapsed_ms = 14;
  repeated string events = 15;     // human readable timeline (reassignments etc.)
}

message WorkerSummary {
  NodeInfo node = 1;
  WorkerHealth health = 2;
  int32 jac = 3;
  int32 active_subtasks = 4;
  repeated int32 neighbour_ids = 5;
  bool is_coordinator = 6;
}

message ClusterStatus {
  CoordinatorInfo coordinator = 1;
  int32 jobs_in_term = 2;
  int32 max_jobs_per_term = 3;
  repeated WorkerSummary workers = 4;
  int32 running_jobs = 5;
}
