// ============================================================================
// bootstrap.proto - Bootstrap Node (worker registry / directory service).
//
// The Bootstrap Node never computes and never takes part in elections.
// It only answers "who is in the cluster?" so that new workers and clients
// can find a first contact point.
// ============================================================================
syntax = "proto3";

package distrilab;

import "common.proto";

option java_package = "proto";
option java_multiple_files = true;

service BootstrapService {
  // A worker joins: gets a unique id (requested or auto-assigned), a random
  // subset of active peers to link with, and the last known coordinator.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Graceful leave (window closed with Ctrl+C / shutdown hook).
  rpc Deregister(NodeRef) returns (Ack);

  // Lease renewal. A worker that stops renewing is removed automatically.
  rpc Heartbeat(NodeRef) returns (LeaseReply);

  // Random active peers (used to repair the overlay after a neighbour dies).
  rpc GetPeers(PeerRequest) returns (PeerList);

  // Every active worker (used by the coordinator and by clients).
  rpc ListWorkers(Empty) returns (PeerList);

  // A worker reports that another node is unreachable.
  rpc ReportFailure(NodeRef) returns (Ack);

  // The elected coordinator publishes itself (highest term wins).
  rpc ReportCoordinator(CoordinatorInfo) returns (Ack);

  // Clients ask where the coordinator is.
  rpc GetCoordinator(Empty) returns (CoordinatorInfo);
}

message RegisterRequest {
  int32 requested_id = 1;  // 0 = let the Bootstrap Node assign the next free id
  string host = 2;
  int32 port = 3;
}

message RegisterResponse {
  NodeInfo assigned = 1;          // identity the worker must use
  repeated NodeInfo peers = 2;    // random active workers to connect to
  CoordinatorInfo coordinator = 3;
  int32 lease_timeout_ms = 4;     // renew the lease more often than this
}

message LeaseReply {
  bool known = 1;   // false -> the worker must register again
}

message PeerRequest {
  int32 requester_id = 1;
  int32 count = 2;
  repeated int32 exclude_ids = 3;
}

message PeerList {
  repeated NodeInfo peers = 1;
}
